[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "trendai"
version = "0.1.0"
description = "과거→현재→미래: 시계열 트렌드 분석과 예측 AI (Trend analysis & forecasting AI)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "pandas>=2.0"]

[project.optional-dependencies]
llm = ["anthropic>=1.0"]
connectors = ["requests>=2.28", "pytrends>=4.9"]
xlsx = ["openpyxl>=3.1"]
web = ["openpyxl>=3.1", "anthropic>=1.0"]    # optional features of the web app (it runs without them)
dev = ["pytest>=7"]

[project.scripts]
trendai = "trendai.cli:main"

[tool.setuptools]
# package data comes only from the explicit patterns below. With the default (true) setuptools also scans the
# manifest and warns "Package 'trendai.web.static…' is absent from the `packages` configuration" once per static
# sub-directory, although the wheel content is the same.
include-package-data = false

[tool.setuptools.packages.find]
include = ["trendai*"]
namespaces = false    # trendai/web/static/** is package data of trendai.web, not a tree of namespace packages

[tool.setuptools.package-data]
"trendai.web" = ["static/**/*", "vm.schema.json"]

[tool.setuptools.exclude-package-data]
"trendai.web" = ["static/dev/**"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = ["e2e: browser end-to-end tests (need node and playwright)"]
