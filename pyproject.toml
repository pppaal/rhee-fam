[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "trendai"
version = "0.1.0"
description = "과거→현재→미래: 시계열 트렌드 분석과 예측 AI (Trend analysis & forecasting AI)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "pandas>=2.0"]

[project.optional-dependencies]
llm = ["anthropic>=1.0"]
connectors = ["requests>=2.28", "pytrends>=4.9"]
dev = ["pytest>=7"]

[project.scripts]
trendai = "trendai.cli:main"

[tool.setuptools.packages.find]
include = ["trendai*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
